name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK Artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./SoundPulse-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundPulse-Android-APK
          path: ./SoundPulse-v1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-apk-latest
          name: SoundPulse Android APK (Latest)
          body: |
            ## 🎵 SoundPulse for Android (APK)

            ### Direct Download:
            Download **`SoundPulse-v1.0.0.apk`** below and install it directly on your Android phone or tablet.

            ### Features:
            - 🎶 100% Free Music Streaming
            - 💎 Dark Glassmorphic Mobile UI
            - ⚡ Real Algorithmic Recommendations & Quick Picks
            - 🎙️ Synchronized Real-Time Lyrics
            - 🔒 Google Sign-In & YouTube Music Integration
            - 📱 Standalone Full-Screen Android Application
          files: ./SoundPulse-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
