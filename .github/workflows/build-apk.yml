name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          echo "Locating built APK..."
          find android/app/build/outputs -type f -name "*.apk"
          APK_FILE=$(find android/app/build/outputs -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found!"
            exit 1
          fi
          echo "Copying $APK_FILE to ./SoundPulse-v1.0.0.apk"
          cp "$APK_FILE" ./SoundPulse-v1.0.0.apk
          ls -lh ./SoundPulse-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundPulse-Android-APK
          path: ./SoundPulse-v1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: SoundPulse Android APK v1.0.0
          body: |
            ## 🎵 SoundPulse for Android (APK)

            ### Direct Download:
            Download **`SoundPulse-v1.0.0.apk`** below and install it directly on your Android phone or tablet.

            ### Features:
            - 🎶 100% Free Music Discovery & Playback
            - 💎 Dark Glassmorphic Modern UI
            - ⚡ Real Algorithmic Recommendations & Quick Picks
            - 🎙️ Synchronized Real-Time Lyrics
            - 🔒 Google Sign-In & YouTube Music Integration
            - 📱 Continuous Background Audio Playback
          files: ./SoundPulse-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
